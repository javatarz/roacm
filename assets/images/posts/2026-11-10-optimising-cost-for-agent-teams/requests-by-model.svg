<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Requests by model, before and after</title>
  <desc id="d">Share of requests by model. Mostly Opus phase: Opus 83%, Sonnet 12%, Haiku 5%. First day after the tiers: Opus 30%, Sonnet 39%, Haiku 31%.</desc>
  <style>
    .opus { fill: #2a78d6; }
    .sonnet { fill: #2e9e6b; }
    .haiku { fill: #eb6834; }
    .label { font-size: 14px; font-weight: 500; fill: #7a7a7a; }
    .value { font-size: 13px; fill: #7a7a7a; }
  </style>
  <rect class="opus" x="200" y="22" width="14" height="14" rx="3"/><text class="value" x="220" y="34">Opus (top tier)</text>
  <rect class="sonnet" x="335" y="22" width="14" height="14" rx="3"/><text class="value" x="355" y="34">Sonnet (mid tier)</text>
  <rect class="haiku" x="485" y="22" width="14" height="14" rx="3"/><text class="value" x="505" y="34">Haiku (cheap tier)</text>
  <text class="label" x="188" y="114" text-anchor="end">Mostly Opus</text>
  <rect class="opus" x="200.0" y="95" width="429.6" height="28" rx="3"/>
  <text class="value" x="414.8" y="88" text-anchor="middle">83%</text>
  <rect class="sonnet" x="631.6" y="95" width="60.4" height="28" rx="3"/>
  <text class="value" x="661.8" y="88" text-anchor="middle">12%</text>
  <rect class="haiku" x="694.0" y="95" width="24.0" height="28" rx="3"/>
  <text class="value" x="706.0" y="88" text-anchor="middle">5%</text>
  <text class="label" x="188" y="194" text-anchor="end">First day after</text>
  <rect class="opus" x="200.0" y="175" width="154.0" height="28" rx="3"/>
  <text class="value" x="277.0" y="168" text-anchor="middle">30%</text>
  <rect class="sonnet" x="356.0" y="175" width="200.8" height="28" rx="3"/>
  <text class="value" x="456.4" y="168" text-anchor="middle">39%</text>
  <rect class="haiku" x="558.8" y="175" width="159.2" height="28" rx="3"/>
  <text class="value" x="638.4" y="168" text-anchor="middle">31%</text>
</svg>
