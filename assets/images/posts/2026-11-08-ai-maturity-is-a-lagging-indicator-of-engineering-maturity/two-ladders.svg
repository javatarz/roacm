<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What a team at E3 can run</title>
  <desc id="d">Engineering maturity levels E0 to E5 on the left, with E3 highlighted. AI autonomy levels A0 to A5 on the right. Arrows from E3 show what each AI level means for that team. A3, the matching level, is the sweet spot. A4, one level up, is a stretch the team pays for in waiting or rework. A5, two levels up, is unsafe, where the extra speed turns into rework, and its arrow stops short with a cross. A0 to A2 are headroom: engineering that could support more autonomy than is used.</desc>
  <defs>
    <marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2e9e6b"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c98a0b"/></marker>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9a9a9a"/></marker>
  </defs>
  <style>
    .box { fill: #2a78d6; fill-opacity: 0.12; stroke: #2a78d6; stroke-width: 1.5; }
    .label { font-size: 14px; font-weight: 600; fill: #7a7a7a; }
    .code { font-size: 15px; font-weight: 700; fill: #2a78d6; }
    .head { font-size: 14px; font-weight: 600; fill: #7a7a7a; text-anchor: middle; }
    .me { fill: #2a78d6; stroke: #2a78d6; stroke-width: 1.5; }
    .me-text { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .green-box { fill: #2e9e6b; fill-opacity: 0.18; stroke: #2e9e6b; stroke-width: 2; }
    .amber-box { fill: #c98a0b; fill-opacity: 0.16; stroke: #c98a0b; stroke-width: 2; }
    .red-box { fill: #d64545; fill-opacity: 0.14; stroke: #d64545; stroke-width: 2; }
    .green { fill: #2e9e6b; } .amber { fill: #c98a0b; } .red { fill: #d64545; }
    .zone-green { fill: #2e9e6b; fill-opacity: 0.08; }
    .zone-amber { fill: #c98a0b; fill-opacity: 0.08; }
    .zone-red { fill: #d64545; fill-opacity: 0.08; }
    .zone-blue { fill: #2a78d6; fill-opacity: 0.05; }
    .zone { font-size: 15px; font-weight: 700; }
    .note { font-size: 12px; fill: #7a7a7a; }
    .divider { stroke: #b0b0b0; stroke-width: 1.5; }
  </style>

  <text class="head" x="140" y="28">Engineering maturity</text>
  <text class="head" x="550" y="28">AI autonomy</text>

  <!-- zone bands behind the AI ladder -->
  <rect class="zone-red" x="410" y="44" width="390" height="60"/>
  <rect class="zone-amber" x="410" y="108" width="390" height="60"/>
  <rect class="zone-green" x="410" y="172" width="390" height="60"/>
  <rect class="zone-blue" x="410" y="236" width="390" height="188"/>
  <path class="divider" d="M410,44 V424"/>

  <!-- engineering ladder -->
  <rect class="box" x="20" y="50" width="240" height="48" rx="8"/>
  <text class="code" x="38" y="79">E5</text><text class="label" x="74" y="79">Measured feedback</text>
  <rect class="box" x="20" y="114" width="240" height="48" rx="8"/>
  <text class="code" x="38" y="143">E4</text><text class="label" x="74" y="143">Scoped, parallel checks</text>
  <rect class="me" x="20" y="178" width="240" height="48" rx="8"/>
  <text class="me-text" x="38" y="207">E3</text><text class="me-text" x="74" y="207" style="font-size:14px">Checks on every commit</text>
  <rect class="box" x="20" y="242" width="240" height="48" rx="8"/>
  <text class="code" x="38" y="271">E2</text><text class="label" x="74" y="271">Fast local feedback</text>
  <rect class="box" x="20" y="306" width="240" height="48" rx="8"/>
  <text class="code" x="38" y="335">E1</text><text class="label" x="74" y="335">Tests in CI</text>
  <rect class="box" x="20" y="370" width="240" height="48" rx="8"/>
  <text class="code" x="38" y="399">E0</text><text class="label" x="74" y="399">Manual</text>

  <!-- AI ladder -->
  <rect class="red-box" x="440" y="50" width="200" height="48" rx="8"/>
  <text class="code" x="458" y="79" style="fill:#d64545">A5</text><text class="label" x="494" y="79">Self-improving</text>
  <rect class="amber-box" x="440" y="114" width="200" height="48" rx="8"/>
  <text class="code" x="458" y="143" style="fill:#a8730a">A4</text><text class="label" x="494" y="143">Agent teams</text>
  <rect class="green-box" x="440" y="178" width="200" height="48" rx="8"/>
  <text class="code" x="458" y="207" style="fill:#2e9e6b">A3</text><text class="label" x="494" y="207">Pair</text>
  <rect class="box" x="440" y="242" width="200" height="48" rx="8"/>
  <text class="code" x="458" y="271">A2</text><text class="label" x="494" y="271">Task assistant</text>
  <rect class="box" x="440" y="306" width="200" height="48" rx="8"/>
  <text class="code" x="458" y="335">A1</text><text class="label" x="494" y="335">Autocomplete</text>
  <rect class="box" x="440" y="370" width="200" height="48" rx="8"/>
  <text class="code" x="458" y="399">A0</text><text class="label" x="494" y="399">No AI</text>

  <!-- arrows from E3 -->
  <path d="M260,202 H430" stroke="#2e9e6b" stroke-width="5" fill="none" marker-end="url(#ah-green)"/>
  <path d="M260,198 C340,198 350,138 430,138" stroke="#c98a0b" stroke-width="3" fill="none" marker-end="url(#ah-amber)"/>
  <path d="M260,194 C320,190 350,110 384,84" stroke="#d64545" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" fill="none"/>
  <circle cx="392" cy="78" r="9" fill="#ffffff" stroke="#d64545" stroke-width="2.5"/>
  <path d="M387.5,73.5 L396.5,82.5 M396.5,73.5 L387.5,82.5" stroke="#d64545" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M260,208 C340,208 350,266 430,266" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ah-grey)"/>
  <path d="M260,212 C350,212 340,330 430,330" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ah-grey)"/>
  <path d="M260,216 C360,216 330,394 430,394" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ah-grey)"/>

  <!-- zone labels -->
  <text class="zone red" x="660" y="72">Unsafe</text>
  <text class="note" x="660" y="90">speed turns into rework</text>
  <text class="zone amber" x="660" y="136" style="fill:#a8730a">Stretch</text>
  <text class="note" x="660" y="154">waiting or rework</text>
  <text class="zone green" x="660" y="200">Sweet spot</text>
  <text class="note" x="660" y="218">uses what E3 supports</text>
  <path d="M652,246 q6,0 6,8 v68 q0,8 6,8 q-6,0 -6,8 v68 q0,8 -6,8" stroke="#9a9a9a" stroke-width="1.5" fill="none"/>
  <text class="zone" x="672" y="328" style="fill:#2a78d6">Headroom</text>
  <text class="note" x="672" y="346">more is possible</text>

  <text class="note" x="400" y="456" text-anchor="middle">Climb to E4 and every zone moves up one level.</text>
</svg>
