<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The two maturity ladders</title>
  <desc id="d">AI autonomy levels A0 to A5 on the left and engineering maturity levels E0 to E5 on the right. Each A level is joined to the E level with the same number. The joins get stronger up the ladder: faint for A0 and A1, lighter for A2, and solid from A3 up, where the link is strict.</desc>
  <style>
    .box { fill: #2a78d6; fill-opacity: 0.12; stroke: #2a78d6; stroke-width: 1.5; }
    .label { font-size: 15px; font-weight: 600; fill: #7a7a7a; }
    .code { font-size: 15px; font-weight: 700; fill: #2a78d6; }
    .head { font-size: 14px; font-weight: 600; fill: #7a7a7a; text-anchor: middle; }
    .line { stroke: #7a7a7a; stroke-width: 2; fill: none; }
    .mid { stroke: #7a7a7a; stroke-width: 1.5; fill: none; opacity: 0.6; }
    .faint { stroke: #7a7a7a; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; opacity: 0.4; }
  </style>
  <rect class="box" x="20" y="340" width="290" height="48" rx="8"/>
  <text class="code" x="40" y="370">A0</text><text class="label" x="80" y="370">No AI</text>
  <rect class="box" x="450" y="340" width="290" height="48" rx="8"/>
  <text class="code" x="470" y="370">E0</text><text class="label" x="510" y="370">Manual</text>
  <path class="faint" d="M310,364 H450"/>
  <rect class="box" x="20" y="276" width="290" height="48" rx="8"/>
  <text class="code" x="40" y="306">A1</text><text class="label" x="80" y="306">Autocomplete</text>
  <rect class="box" x="450" y="276" width="290" height="48" rx="8"/>
  <text class="code" x="470" y="306">E1</text><text class="label" x="510" y="306">Tests in CI</text>
  <path class="faint" d="M310,300 H450"/>
  <rect class="box" x="20" y="212" width="290" height="48" rx="8"/>
  <text class="code" x="40" y="242">A2</text><text class="label" x="80" y="242">Task assistant</text>
  <rect class="box" x="450" y="212" width="290" height="48" rx="8"/>
  <text class="code" x="470" y="242">E2</text><text class="label" x="510" y="242">Fast local feedback</text>
  <path class="mid" d="M310,236 H450"/>
  <rect class="box" x="20" y="148" width="290" height="48" rx="8"/>
  <text class="code" x="40" y="178">A3</text><text class="label" x="80" y="178">Pair</text>
  <rect class="box" x="450" y="148" width="290" height="48" rx="8"/>
  <text class="code" x="470" y="178">E3</text><text class="label" x="510" y="178">Checks on every commit</text>
  <path class="line" d="M310,172 H450"/>
  <rect class="box" x="20" y="84" width="290" height="48" rx="8"/>
  <text class="code" x="40" y="114">A4</text><text class="label" x="80" y="114">Agent teams</text>
  <rect class="box" x="450" y="84" width="290" height="48" rx="8"/>
  <text class="code" x="470" y="114">E4</text><text class="label" x="510" y="114">Scoped, parallel checks</text>
  <path class="line" d="M310,108 H450"/>
  <rect class="box" x="20" y="20" width="290" height="48" rx="8"/>
  <text class="code" x="40" y="50">A5</text><text class="label" x="80" y="50">Self-improving agent teams</text>
  <rect class="box" x="450" y="20" width="290" height="48" rx="8"/>
  <text class="code" x="470" y="50">E5</text><text class="label" x="510" y="50">Measured feedback</text>
  <path class="line" d="M310,44 H450"/>
  <text class="head" x="165" y="410">AI autonomy (what you grant)</text>
  <text class="head" x="595" y="410">Engineering maturity (what you automate)</text>
</svg>
