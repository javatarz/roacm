<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Engineering maturity sets the ceiling for AI autonomy</title>
  <desc id="d">A grid with engineering maturity E0 to E5 across and AI autonomy A0 to A5 up. A stepped line marks the ceiling, the highest AI level each engineering level supports: A1 at E0 and E1, then A2 at E2, A3 at E3, A4 at E4 and A5 at E5. Cells on the ceiling are the sweet spot. The cell one level above the ceiling is a stretch, paid for in waiting or rework. Two or more levels above is unsafe, where the extra speed turns into rework. Below the ceiling is headroom. A marker shows this repo moving from A4 on E3, a stretch, to A4 on E4, the sweet spot.</desc>
  <style>
    .c-sweet { fill: #2e9e6b; fill-opacity: 0.22; }
    .c-stretch { fill: #c98a0b; fill-opacity: 0.22; }
    .c-unsafe { fill: #d64545; fill-opacity: 0.14; }
    .c-headroom { fill: #2a78d6; fill-opacity: 0.08; }
    .g-sweet { stroke: #2e9e6b; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .g-stretch { stroke: #c98a0b; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .g-unsafe { stroke: #d64545; stroke-width: 3; fill: none; stroke-linecap: round; }
    .ceil { stroke: #2e9e6b; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .code { font-size: 14px; font-weight: 700; fill: #2a78d6; }
    .name { font-size: 11px; fill: #7a7a7a; }
    .head { font-size: 13px; font-weight: 600; fill: #7a7a7a; text-anchor: middle; }
    .legend { font-size: 12px; fill: #7a7a7a; }
    .mark { font-size: 11px; font-weight: 700; fill: #4a4a4a; text-anchor: middle; }
    .note { font-size: 12px; font-weight: 600; fill: #4a4a4a; text-anchor: middle; }
    .ring { fill: none; stroke: #4a4a4a; stroke-width: 2; }
  </style>
