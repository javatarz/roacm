  <text class="code" x="140" y="344.0" text-anchor="end">A0</text>
  <text class="name" x="140" y="359.0" text-anchor="end">No AI</text>
  <text class="code" x="140" y="292.0" text-anchor="end">A1</text>
  <text class="name" x="140" y="307.0" text-anchor="end">Autocomplete</text>
  <text class="code" x="140" y="240.0" text-anchor="end">A2</text>
  <text class="name" x="140" y="255.0" text-anchor="end">Task assistant</text>
  <text class="code" x="140" y="188.0" text-anchor="end">A3</text>
  <text class="name" x="140" y="203.0" text-anchor="end">Pair</text>
  <text class="code" x="140" y="136.0" text-anchor="end">A4</text>
  <text class="name" x="140" y="151.0" text-anchor="end">Agent teams</text>
  <text class="code" x="140" y="84.0" text-anchor="end">A5</text>
  <text class="name" x="140" y="99.0" text-anchor="end">Self-improving</text>
  <text class="code" x="195.0" y="392" text-anchor="middle">E0</text>
  <text class="name" x="195.0" y="407" text-anchor="middle">Manual</text>
  <text class="code" x="285.0" y="392" text-anchor="middle">E1</text>
